<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Power Home - Monitoreo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='camaras.css') }}">
</head>
<body>

    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "index.html";
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            window.location.href = "index.html";
        }

        function resetAlarm() {
            fetch('/reset_alarm', { method: 'POST' })
                .then(() => {
                    document.getElementById('alarmAlert').style.display = 'none';
                });
        }
    </script>

    <div class="dashboard-card">
        <div class="dash-header">
            <div>
                <h2>Power Home Dashboard</h2>
                <p>Sistema de Monitoreo</p>
            </div>
            <span class="status-pill">● Sistema Activo</span>
        </div>

        <!-- Transmisión de la webcam -->
        <div style="margin-bottom: 20px; text-align: center;">
            <img src="{{ url_for('video_feed') }}" width="100%" style="border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);">
        </div>

        <!-- Alerta de movimiento ocultada por defecto -->
        <div id="alarmAlert" style="display:none; padding: 15px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; border-radius: 14px; margin-bottom: 20px; font-weight: 600; text-align: center;">
            ⚠️ ¡MOVIMIENTO DETECTADO! 
            <button onclick="resetAlarm()" style="margin-left: 15px; padding: 5px 10px; background: #f87171; color: white; border: none; border-radius: 6px; cursor: pointer;">Desactivar</button>
        </div>

        <div class="metrics-grid">
            <div class="metric-box"><h3>Perímetro</h3><p class="metric-value">Protegido</p></div>
            <div class="metric-box"><h3>Cámaras</h3><p class="metric-value">4 Activas</p></div>
        </div>

        <button onclick="logout()" class="btn-danger">Cerrar Sesión</button>
    </div>

    <script>
        // Consulta periódica al servidor para verificar si hubo movimiento
        setInterval(() => {
            fetch('/alarm_status')
                .then(res => res.json())
                .then(data => {
                    if (data.triggered) {
                        document.getElementById('alarmAlert').style.display = 'block';
                    }
                });
        }, 1000);
    </script>
</body>
</html>
