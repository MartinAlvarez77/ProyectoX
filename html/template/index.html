<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Power Home - Acceso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <span class="brand-tag">SISTEMA DE SEGURIDAD</span>
            <h1>Power Home</h1>
            <p>Ingrese sus credenciales de acceso</p>
        </div>
        
        <form onsubmit="validarAcceso(event)">
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="usuario" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Iniciar Sesión</button>
            <div id="errorMsg" style="color: #f87171; font-size: 13px; text-align: center; margin-top: 15px;"></div>
        </form>
    </div>

    <script>
        function validarAcceso(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === "eze" && pass === "ProyectoX") {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = "camaras.html";
            } else {
                document.getElementById('errorMsg').innerText = "Acceso denegado. Por favor, repita el usuario y contraseña.";
                document.getElementById('password').value = "";
            }
        }
    </script>
</body>
</html>
